# TLS required for every network connection; password auth via SCRAM-SHA-256.
# Local (unix socket) connections stay trust - only reachable from inside
# this container/pod, used internally by pg_isready and the entrypoint's
# own setup steps.
local   all             all                                     trust
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
