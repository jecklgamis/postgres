apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "postgres.fullname" . }}-test-connection"
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: psql
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      command: [ 'sh', '-c' ]
      args:
        - >-
          PGSSLMODE=require PGPASSWORD="$POSTGRES_PASSWORD" psql
          -h {{ include "postgres.fullname" . }} -p {{ .Values.service.port }}
          -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select 1"
      env:
        - name: POSTGRES_USER
          value: {{ .Values.postgresUser | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.postgresDb | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "postgres.secretName" . }}
              key: POSTGRES_PASSWORD
  restartPolicy: Never
